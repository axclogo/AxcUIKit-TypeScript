name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22.18.x, 24.x]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # the release gate diffs against the base commit
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/react18/package-lock.json
      # `prepare` builds the package during install, which also proves a git install works.
      - run: npm ci
      - run: npm ci --prefix tests/react18
      # format, types, boundaries, lint, knip, tests on React 19 (with Condition coverage gate) and 18, build, API report, size.
      - run: npm run verify
      - name: Release gate (CHANGELOG and version)
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        run: node scripts/check-release.mjs ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
      - name: Verify package entry points
        run: |
          npm pack --dry-run
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { access } from 'node:fs/promises';
          import { createRequire, registerHooks } from 'node:module';

          const require = createRequire(import.meta.url);
          const guard = registerHooks({ resolve(specifier, context, next) {
            assert.doesNotMatch(specifier, /codemirror|@lezer/);
            return next(specifier, context);
          } });
          for (const entry of ['condition', 'condition/core', 'json-editor', 'json-editor/core', 'table', 'table/core', 'graph', 'graph/core', 'drawer']) {
            const subpath = '@axclogo/uikit/' + entry;
            const required = require(subpath);
            assert.equal(required, await import(subpath));
          }
          const condition = await import('@axclogo/uikit/condition');
          const conditionCore = await import('@axclogo/uikit/condition/core');
          const json = await import('@axclogo/uikit/json-editor');
          const jsonCore = await import('@axclogo/uikit/json-editor/core');
          assert.equal(condition.parseCondition, conditionCore.parseCondition);
          assert.equal(json.parseJsonValue, jsonCore.parseJsonValue);
          assert.equal(typeof json.JsonObjectEditor, 'function');
          assert.deepEqual(jsonCore.parseJsonValue({ active: false }), { active: false });
          guard.deregister();

          assert.equal(typeof (await import('@axclogo/uikit/code-editor')).CodeEditor, 'function');
          const codeMirror = require('@axclogo/uikit/json-editor/codemirror');
          assert.equal(codeMirror, await import('@axclogo/uikit/json-editor/codemirror'));
          assert.equal(typeof codeMirror.CodeMirrorSourceEditor, 'function');
          assert.throws(() => import.meta.resolve('@axclogo/uikit'), { code: 'ERR_PACKAGE_PATH_NOT_EXPORTED' });
          for (const component of ['condition', 'json-editor', 'table', 'graph', 'drawer']) {
            await access(new URL(import.meta.resolve(`@axclogo/uikit/${component}/styles.css`)));
          }
          JS
